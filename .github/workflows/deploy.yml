name: Deploy Vite React to GitHub Pages

# auto deploy when git push in main branch
on:
  push:
    branches:
      - main

# allow bot to run this workflow
permissions:
  contents: read
  pages: write
  id-token: write

# delete previous build
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # clone repo
      - name: Checkout
        uses: actions/checkout@v4

      # setup node
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Build
        run: npm run build

      # use dist to deploy
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  # deploy
  deploy:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
