<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Redirecting...</title>
    <script>
      const base = "/CS-Portfolio";
      const path = window.location.pathname;

      window.location.replace(base + "/?redirect=" + encodeURIComponent(path));
    </script>
  </head>
  <body></body>
</html>
